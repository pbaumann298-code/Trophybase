<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TrophyBase Intranet</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body class="bg-[#0a0b0c] w-full max-w-full overflow-x-hidden">
    <div id="intranet-root"></div>
    <script type="module" src="/src/intranet/main.jsx"></script>
    <script>
      (function () {
        addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('intranet-root');
            if (!root || root.children.length > 0) return;
            var box = document.createElement('div');
            box.style.cssText =
              'font:16px/1.6 system-ui,sans-serif;color:#e4e4e7;max-width:34rem;' +
              'margin:15vh auto;padding:0 1.5rem;text-align:center';
            box.innerHTML =
              '<h1 style="font-size:1.25rem;margin:0 0 .75rem">Intranet konnte nicht starten</h1>' +
              '<p style="margin:0;color:#a1a1aa">Bitte später erneut versuchen oder trophybase.app/intranet.html direkt öffnen.</p>';
            root.appendChild(box);
          }, 2500);
        });
      })();
    </script>
  </body>
</html>
